<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- AudioDesk logo: three mixer faders on a blue-to-violet rounded square. make-icons.ps1 renders the same design. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF" />
      <stop offset="1" stop-color="#8A3FFC" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)" />
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)" />
  <g fill="#FFFFFF">
    <rect x="72" y="58" width="16" height="140" rx="8" fill-opacity="0.4" />
    <rect x="120" y="58" width="16" height="140" rx="8" fill-opacity="0.4" />
    <rect x="168" y="58" width="16" height="140" rx="8" fill-opacity="0.4" />
    <rect x="56" y="142" width="48" height="28" rx="14" />
    <rect x="104" y="82" width="48" height="28" rx="14" />
    <rect x="152" y="118" width="48" height="28" rx="14" />
  </g>
</svg>
